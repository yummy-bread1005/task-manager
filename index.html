<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>タスク管理</title>
<meta name="description" content="個人用のシンプルなタスク管理ツール" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#A9702F" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="タスク管理" />
<style>
  :root {
    --paper: #FBF4E6;
    --card: #FFFFFF;
    --ink: #4A3222;
    --ink-soft: #8A7460;
    --ink-faint: #C2AF97;
    --line: #EEE2CC;
    --crust: #A9702F;
    --crust-dark: #8B5A22;
    --rust-soft: #F1DCCB;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: Meiryo, "Meiryo UI", -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    padding: max(20px, env(safe-area-inset-top)) 18px calc(30px + env(safe-area-inset-bottom));
  }
  .tm-shell { max-width: 560px; margin: 0 auto; }

  .tm-deco {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    gap: 4px;
    margin-bottom: 6px;
    user-select: none;
  }
  .tm-deco img {
    width: 34px;
    height: 34px;
    object-fit: contain;
  }
  .tm-deco img:nth-child(odd) { transform: rotate(-8deg) translateY(2px); }
  .tm-deco img:nth-child(even) { transform: rotate(7deg); }
  .tm-deco.bottom { margin-top: 22px; margin-bottom: 0; }

  .tm-header { text-align: center; margin-bottom: 22px; }
  .tm-title {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 0.02em;
    margin: 0 0 4px;
  }
  .tm-subtitle { font-size: 15px; color: var(--ink-soft); margin: 0; }

  .tm-add-row {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
  }
  .tm-add-input {
    flex: 1;
    border: 1.5px solid var(--line);
    background: var(--card);
    border-radius: 14px;
    font-size: 17px;
    padding: 13px 16px;
    color: var(--ink);
    outline: none;
    font-family: inherit;
    transition: border-color 0.15s ease;
  }
  .tm-add-input:focus { border-color: var(--crust); }
  .tm-add-input::placeholder { color: var(--ink-faint); }

  .tm-add-btn {
    flex: none;
    width: 48px;
    height: 48px;
    border-radius: 14px;
    border: none;
    background: var(--crust);
    color: #fff;
    font-size: 24px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease;
  }
  .tm-add-btn:active { background: var(--crust-dark); }
  .tm-add-btn:disabled { background: var(--ink-faint); cursor: default; }

  .tm-card {
    background: var(--card);
    border-radius: 18px;
    border: 1px solid var(--line);
    overflow: hidden;
    margin-bottom: 14px;
  }

  .tm-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 18px;
    border-bottom: 1px solid var(--line);
  }
  .tm-row:last-child { border-bottom: none; }

  .tm-check {
    flex: none;
    width: 25px; height: 25px;
    border-radius: 50%;
    border: 2px solid var(--ink-faint);
    background: #fff;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    padding: 0;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .tm-check.checked { background: var(--crust); border-color: var(--crust); }
  .tm-check svg { width: 15px; height: 15px; color: #fff; }
  .tm-check.checked svg { animation: tm-pop 0.18s ease forwards; }
  @keyframes tm-pop { from { transform: scale(0); } to { transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) {
    .tm-check.checked svg { animation: none; }
  }

  .tm-title-text {
    flex: 1;
    min-width: 0;
    font-size: 17px;
    cursor: text;
    padding: 2px 0;
    word-break: break-word;
  }
  .tm-title-text.done { color: var(--ink-faint); text-decoration: line-through; }

  .tm-title-input {
    flex: 1;
    min-width: 0;
    font-size: 17px;
    border: none;
    border-bottom: 1.5px solid var(--crust);
    background: transparent;
    outline: none;
    padding: 2px 0;
    font-family: inherit;
    color: var(--ink);
  }

  .tm-delete-btn {
    flex: none;
    background: none;
    border: none;
    color: var(--ink-faint);
    cursor: pointer;
    padding: 4px;
    display: flex;
    border-radius: 6px;
    opacity: 0.7;
    transition: color 0.15s ease, background 0.15s ease, opacity 0.15s ease;
  }
  .tm-delete-btn:hover { color: #9C4B33; background: var(--rust-soft); opacity: 1; }
  .tm-delete-btn svg { width: 16px; height: 16px; }

  .tm-done-toggle {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 18px;
    font-size: 15px;
    font-weight: 600;
    color: var(--ink-soft);
    cursor: pointer;
    font-family: inherit;
    margin-bottom: 14px;
  }
  .tm-done-toggle .tm-chevron {
    transition: transform 0.15s ease;
  }
  .tm-done-toggle.open .tm-chevron { transform: rotate(180deg); }

  .tm-empty {
    padding: 26px 18px;
    text-align: center;
    color: var(--ink-soft);
    font-size: 15px;
  }

  .tm-check:focus-visible, .tm-delete-btn:focus-visible, .tm-add-btn:focus-visible, .tm-done-toggle:focus-visible {
    outline: 2px solid var(--crust);
    outline-offset: 2px;
  }

  @media (max-width: 380px) {
    .tm-title { font-size: 26px; }
    .tm-deco img { width: 28px; height: 28px; }
  }
</style>
</head>
<body>
  <div class="tm-shell">
    <div class="tm-deco top" id="deco-top"></div>

    <div class="tm-header">
      <h1 class="tm-title">タスク管理</h1>
      <p class="tm-subtitle" id="subtitle"></p>
    </div>

    <form class="tm-add-row" id="add-form">
      <input class="tm-add-input" id="new-title" type="text" placeholder="新しいタスクを入力" autocomplete="off" />
      <button class="tm-add-btn" id="add-btn" type="submit" disabled aria-label="追加">＋</button>
    </form>

    <div class="tm-card" id="active-card">
      <div id="active-list"></div>
    </div>

    <button class="tm-done-toggle" id="done-toggle" type="button">
      <span id="done-label">完了（0）</span>
      <svg class="tm-chevron" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="tm-card" id="done-card" hidden>
      <div id="done-list"></div>
    </div>

    <div class="tm-deco bottom" id="deco-bottom"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
